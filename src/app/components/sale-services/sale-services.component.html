
<app-buttons-header
  (_onActionMarketing)="onActionMarketing()"
  (_onSendMessage)="onSendMessage()"
  (_onFilter)="onLoadFilter()"
  context="Serviços">

</app-buttons-header>
<div  class="formgrid grid">
  <div class="c-margin col-12 md:col-12">
    <app-datatable
      [config]="datatable"
      dataKey="IDProduto"
      (onSelectedRegister)="onSelectedData($event)"
      (onPageChange)="onLoadData($event)">
    </app-datatable>
  </div>
</div>

<p-drawer
  [style]="{'height': '40rem', 'border-radius': '20px 20px 0 0'}"
  header="Detalhes"
  position="bottom"
  [(visible)]="openDetails">
  <div>
    <app-datatable dataKey="nome" [showPagination]="false" [config]="this.configuration.datatableConsumers"></app-datatable>
  </div>
</p-drawer>
