<p-floatLabel variant="on">
  <p-inputNumber
    (ngModelChange)="onChange($event)"
    [ngModel]="value"
    [ngClass]="{'ng-invalid ng-dirty': !isValid}"
    class="p-inputnumber"
    [pTooltip]="guidance"
    inputId="minmaxfraction"
    mode="decimal"
    [maxlength]="maxlength"
    [disabled]="disabled"
    [autofocus]="focus"
    [minFractionDigits]="minFractionDigits"
    [maxFractionDigits]="maxFractionDigits" />
  <label id="">{{label}}</label>
</p-floatLabel>
